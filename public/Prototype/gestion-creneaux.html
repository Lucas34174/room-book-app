<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Gestion des créneaux — RoomBook</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="brand">Room<span>Book</span></div>
  <nav>
    <a href="accueil.html">Accueil</a>
    <a href="liste-utilisateurs.html">Utilisateurs</a>
    <a href="liste-salles.html" class="active">Salles</a>
    <a href="statistiques.html">Statistiques</a>
    <a href="logs.html">Historique</a>
  </nav>
  <div class="user-zone">
    <a href="notifications.html">Notifications<span class="notif-badge">3</span></a>
    <a href="profil.html">Administrateur</a>
  </div>
</div>

<div class="page-wrap" style="max-width:760px;">
  <div class="page-header">
    <h1>Créneaux — Salle B12</h1>
    <a href="liste-salles.html" class="breadcrumb" style="text-decoration:underline;">Retour</a>
  </div>

  <div class="panel" style="padding:0; margin-bottom:18px;">
    <table>
      <tr><th>Jour</th><th>Début</th><th>Fin</th><th>Note</th></tr>
      <tr><td>Lundi</td><td>08h00</td><td>10h00</td><td>Cours magistraux</td></tr>
      <tr><td>Mardi</td><td>10h00</td><td>12h00</td><td>—</td></tr>
      <tr><td>Mercredi</td><td>14h00</td><td>16h00</td><td>TP informatique</td></tr>
    </table>
  </div>

  <div class="panel">
    <div class="panel-title">Ajouter un créneau</div>
    <div class="field-row">
      <div class="field">
        <label>Jour</label>
        <select>
          <option>Lundi</option><option>Mardi</option><option>Mercredi</option>
          <option>Jeudi</option><option>Vendredi</option><option>Samedi</option>
        </select>
      </div>
      <div class="field">
        <label>Heure de début</label>
        <input type="time">
      </div>
      <div class="field">
        <label>Heure de fin</label>
        <input type="time">
      </div>
    </div>
    <div class="field">
      <label>Note (optionnel)</label>
      <input type="text" placeholder="Ex : TP informatique">
    </div>
    <div style="display:flex; gap:12px;">
      <a href="liste-salles.html" class="btn btn-sm">Ajouter</a>
      <a href="liste-salles.html" class="btn btn-outline btn-sm">Enregistrer</a>
    </div>
  </div>
</div>

</body>
</html>
