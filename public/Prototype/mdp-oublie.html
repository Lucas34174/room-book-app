<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Mot de passe oublié — RoomBook</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand-mark">RoomBook</div>
    <h1>Mot de passe oublié</h1>
    <p class="help-text" style="margin-bottom:20px;">
      Indiquez votre email, un lien de réinitialisation vous sera envoyé.
    </p>

    <form action="connexion.html">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email">
      </div>
      <button class="btn" type="submit">Envoyer</button>
    </form>

    <div class="auth-links">
      <a href="connexion.html">Retour à la connexion</a>
    </div>
  </div>
</div>

</body>
</html>
