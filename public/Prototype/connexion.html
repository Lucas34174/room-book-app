<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Connexion — RoomBook</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand-mark">RoomBook</div>
    <h1>Connexion</h1>

    <div class="alert">
      Ce compte n'est pas encore validé, ou a été désactivé par l'administration. Contactez le service logistique pour plus d'informations.
    </div>

    <form action="accueil.html">
      <div class="field">
        <label for="login">Email ou nom d'utilisateur</label>
        <input type="text" id="login" placeholder="prenom.nom@etablissement.mg ou pseudo">
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input type="password" id="password">
      </div>
      <button class="btn" type="submit">Se connecter</button>
    </form>

    <div class="auth-links">
      <a href="mdp-oublie.html">Mot de passe oublié ?</a>
      &nbsp;·&nbsp;
      <a href="inscription.html">Créer un compte</a>
    </div>
  </div>
</div>

</body>
</html>
