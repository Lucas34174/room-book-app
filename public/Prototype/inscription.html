<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Inscription — RoomBook</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card" style="width:460px;">
    <div class="brand-mark">RoomBook</div>
    <h1>Créer un compte</h1>

    <form action="connexion.html">
      <div class="field-row">
        <div class="field">
          <label for="firstname">Prénom</label>
          <input type="text" id="firstname">
        </div>
        <div class="field">
          <label for="lastname">Nom</label>
          <input type="text" id="lastname">
        </div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email">
      </div>

      <div class="field">
        <label for="username">Nom d'utilisateur</label>
        <input type="text" id="username">
      </div>

      <div class="field-row">
        <div class="field">
          <label for="pwd">Mot de passe</label>
          <input type="password" id="pwd">
        </div>
        <div class="field">
          <label for="pwd2">Confirmer</label>
          <input type="password" id="pwd2">
        </div>
      </div>

      <div class="field">
        <label>Je suis</label>
        <select>
          <option>Enseignant</option>
          <option>Étudiant / Association</option>
        </select>
      </div>
      <p class="help-text">Votre compte sera actif après validation par l'administration.</p>

      <button class="btn" type="submit">S'inscrire</button>
    </form>

    <div class="auth-links">
      Déjà un compte ? <a href="connexion.html">Se connecter</a>
    </div>
  </div>
</div>

</body>
</html>
