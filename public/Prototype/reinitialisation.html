<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Réinitialisation du mot de passe — RoomBook</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand-mark">RoomBook</div>
    <h1>Nouveau mot de passe</h1>

    <form action="connexion.html">
      <div class="field">
        <label for="pwd">Nouveau mot de passe</label>
        <input type="password" id="pwd">
      </div>
      <div class="field">
        <label for="pwd2">Confirmer le nouveau mot de passe</label>
        <input type="password" id="pwd2">
      </div>
      <button class="btn" type="submit">Valider</button>
    </form>
  </div>
</div>

</body>
</html>
